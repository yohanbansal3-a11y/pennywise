:root{

  --mint-bg:#22443A; --mint-fg:#A8E8C6; --mint-bar:#4FBF8B;
  --lilac-bg:#3B3070; --lilac-fg:#D4C8FF; --lilac-bar:#9C86F0;
  --sky-bg:#223F5C; --sky-fg:#B5D9FB; --sky-bar:#5BA8EA;
  --butter-bg:#4A3F1C; --butter-fg:#F7DD85; --butter-bar:#E7B722;
  --rose-bg:#4D2638; --rose-fg:#FAB5CD; --rose-bar:#EF7FA8;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#16132A; --surface:#211D3A; --surface-2:#2B2649; --ink:#F2EEFF; --muted:#B0AACD; --line:#3A3460;
  --accent:#B9A6FF; --on-accent:#17132B; --hero:#35295F;
  --peach-bg:#4A2E27; --peach-fg:#FFC4AD; --peach-bar:#F2916A;
  --mint-bg:#22443A; --mint-fg:#A8E8C6; --mint-bar:#4FBF8B;
  --lilac-bg:#3B3070; --lilac-fg:#D4C8FF; --lilac-bar:#9C86F0;
  --sky-bg:#223F5C; --sky-fg:#B5D9FB; --sky-bar:#5BA8EA;
  --butter-bg:#4A3F1C; --butter-fg:#F7DD85; --butter-bar:#E7B722;

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--ink);font:16px/1.5 var(--font-body);min-height:100%}
h1,h2,h3{font-family:var(--font-display);line-height:1.15;margin:0;text-wrap:balance}
h1{font-size:clamp(1.7rem,4.5vw,2.3rem);font-weight:800;letter-spacing:-.02em}
h2{font-size:1.25rem;font-weight:700;letter-spacing:-.01em}
h3{font-size:1.05rem;font-weight:700}
p{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.ic{flex:none}

.h-peach{--hb:var(--peach-bg);--hf:var(--peach-fg);--hm:var(--peach-bar)}
.h-mint{--hb:var(--mint-bg);--hf:var(--mint-fg);--hm:var(--mint-bar)}
.h-lilac{--hb:var(--lilac-bg);--hf:var(--lilac-fg);--hm:var(--lilac-bar)}
.h-sky{--hb:var(--sky-bg);--hf:var(--sky-fg);--hm:var(--sky-bar)}
.h-butter{--hb:var(--butter-bg);--hf:var(--butter-fg);--hm:var(--butter-bar)}
.h-rose{--hb:var(--rose-bg);--hf:var(--rose-fg);--hm:var(--rose-bar)}

.wrap{max-width:1180px;margin:0 auto;display:grid;grid-template-columns:232px minmax(0,1fr);gap:32px;
  padding-block:24px 120px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.side{position:sticky;top:24px;align-self:start;display:flex;flex-direction:column;gap:20px}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--font-display);font-weight:800;font-size:1.4rem;letter-spacing:-.02em}
.coin{width:34px;height:34px;border-radius:50%;background:var(--butter-bar);color:#4A3500;display:grid;place-items:center;font-weight:800;font-size:1.05rem;box-shadow:inset 0 -3px 0 rgba(0,0,0,.12)}
.nav{display:flex;flex-direction:column;gap:4px}
.nav button{display:flex;align-items:center;gap:12px;border:0;background:none;padding:11px 14px;border-radius:16px;font-weight:600;color:var(--muted);text-align:left;min-height:46px}
.nav button:hover{background:var(--surface-2);color:var(--ink)}
.nav button[aria-current="page"]{background:var(--lilac-bg);color:var(--lilac-fg)}
.switch{display:flex;align-items:center;gap:10px;border:1.5px solid var(--line);background:var(--surface);border-radius:999px;padding:8px 14px;font-weight:600;min-height:44px}
.switch .knob{width:36px;height:20px;border-radius:99px;background:var(--line);position:relative;flex:none}
.switch .knob::after{content:"";position:absolute;top:3px;left:3px;width:14px;height:14px;border-radius:50%;background:var(--surface)}
.switch[aria-checked="true"] .knob{background:var(--accent)}
.switch[aria-checked="true"] .knob::after{left:19px}
.topbar{display:none;align-items:center;justify-content:space-between;gap:12px;grid-column:1/-1}
.tabbar{display:none;position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);
  padding:6px max(8px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px))}
.tabbar button{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;gap:2px;border:0;background:none;padding:6px 2px;border-radius:14px;font-size:12px;font-weight:600;color:var(--muted)}
.tabbar button[aria-current="page"]{background:var(--lilac-bg);color:var(--lilac-fg)}
.fab{position:fixed;z-index:19;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(24px + env(safe-area-inset-bottom,0px));display:flex;align-items:center;gap:8px;
  border:0;border-radius:999px;background:var(--accent);color:var(--on-accent);font-weight:700;padding:14px 22px;min-height:52px;box-shadow:0 8px 24px rgba(80,50,180,.28)}
@media (max-width:860px){
  .wrap{grid-template-columns:minmax(0,1fr);gap:18px;padding-block:16px 150px}
  .side{display:none}.topbar{display:flex}.tabbar{display:flex}
  .fab{bottom:calc(78px + env(safe-area-inset-bottom,0px));padding:14px 18px}
}

main{min-width:0;display:flex;flex-direction:column;gap:20px;outline:none}
.vh{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap}
.eyebrow{font-size:13px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:4px}
.acts{display:flex;gap:8px;flex-wrap:wrap}
.card{background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:20px;min-width:0}
.card>h2,.card>h3{margin-bottom:12px}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(auto-fit,minmax(min(100%,320px),1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(min(100%,230px),1fr))}
.row{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1.5px solid transparent;border-radius:999px;padding:10px 18px;min-height:44px;font-weight:700;background:var(--accent);color:var(--on-accent)}
.btn.soft{background:var(--surface);border-color:var(--line);color:var(--ink)}
.btn.soft:hover{background:var(--surface-2)}
.btn.sm{padding:6px 14px;min-height:38px;font-size:14px}
.btn.danger{background:var(--rose-bg);color:var(--rose-fg)}
.icon-btn{display:grid;place-items:center;width:40px;height:40px;border-radius:50%;border:0;background:none;color:var(--muted);flex:none}
.icon-btn:hover{background:var(--surface-2);color:var(--ink)}
.chip-btn{border:1.5px solid var(--line);background:var(--surface);border-radius:999px;padding:8px 16px;min-height:40px;font-weight:600}
.chip-btn[aria-pressed="true"]{background:var(--lilac-bg);color:var(--lilac-fg);border-color:transparent}
.pill{display:inline-flex;align-items:center;gap:6px;padding:2px 10px;border-radius:99px;font-size:12px;font-weight:700;background:var(--hb);color:var(--hf);white-space:nowrap}
.badge{width:40px;height:40px;border-radius:14px;display:grid;place-items:center;font-weight:800;background:var(--hb);color:var(--hf);font-family:var(--font-display);flex:none}

.hero{position:relative;overflow:hidden;background:var(--hero);border-radius:28px;padding:24px;display:grid;gap:18px}
.hero .deco{position:absolute;right:-18px;top:-18px;opacity:.55;pointer-events:none}
.bal{font-family:var(--font-display);font-size:clamp(2.4rem,8vw,3.6rem);font-weight:800;letter-spacing:-.03em;line-height:1}
.mini-row{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.mini{background:var(--surface);border-radius:18px;padding:12px 14px;min-width:0}

.mini span{font-size:13px;color:var(--muted);font-weight:600}
.alerts{display:grid;gap:8px}
.alert{display:flex;gap:12px;align-items:flex-start;padding:12px 16px;border-radius:16px;background:var(--hb);color:var(--hf);font-weight:600}

.meter{height:14px;border-radius:99px;background:var(--surface-2);overflow:hidden}
.meter>i{display:block;height:100%;border-radius:99px;background:var(--hm,var(--accent));width:var(--w,0%)}
.big{font-family:var(--font-display);font-size:1.7rem;font-weight:800;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.stack{display:grid;gap:10px}

.list{list-style:none;margin:0;padding:0;display:grid}
.tx{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}

.tx-main{flex:1;min-width:0}
.tx-desc{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

input,select,textarea{background:var(--surface-2);border:1.5px solid var(--line);border-radius:14px;padding:10px 14px;min-height:46px;width:100%}
textarea{min-height:120px;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:13px}
label.f{display:grid;gap:6px;font-weight:600;font-size:14px}
.form{display:grid;gap:14px}
.seg{display:flex;gap:6px;background:var(--surface-2);padding:4px;border-radius:999px}

.seg input{position:absolute;opacity:0;inset:0;width:100%;height:100%;min-height:0;cursor:pointer}
.seg span{display:block;text-align:center;padding:9px 12px;border-radius:999px;font-weight:700;color:var(--muted)}

.swatches{display:flex;gap:10px;flex-wrap:wrap}
.swatches label{position:relative}
.swatches input{position:absolute;opacity:0;inset:0;width:100%;height:100%;min-height:0;cursor:pointer}
.swatches span{display:block;width:38px;height:38px;border-radius:50%;background:var(--hm);border:3px solid var(--surface)}
.swatches input:checked+span{outline:3px solid var(--ink)}
.swatches input:focus-visible+span{outline:3px solid var(--accent);outline-offset:2px}

.dlg-h{display:flex;align-items:center;justify-content:space-between;gap:12px}

.chart .gl{stroke:var(--line);stroke-width:1}

.legend i{display:inline-block;width:12px;height:12px;border-radius:4px;margin-right:6px;vertical-align:-1px}
.bars{display:grid;gap:12px}
.bar-row{display:grid;gap:6px}
.lvl{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.ch{display:grid;gap:10px}
.ch.done{opacity:.8}
.quiz-opt{display:flex;gap:10px;align-items:flex-start;padding:10px 14px;border:1.5px solid var(--line);border-radius:14px;cursor:pointer}
.quiz-opt input{width:20px;height:20px;min-height:0;margin-top:2px;flex:none}
.fb{padding:10px 14px;border-radius:14px;background:var(--hb);color:var(--hf);font-weight:600}
details.about summary{cursor:pointer;font-weight:700;min-height:32px}
details.about ul{margin:8px 0 0;padding-left:20px;display:grid;gap:4px}
.csv{min-height:140px}
#toast{position:fixed;z-index:60;left:50%;transform:translateX(-50%) translateY(20px);bottom:calc(150px + env(safe-area-inset-bottom,0px));max-width:min(440px,calc(100vw - 32px));

@media (min-width:861px){#toast{bottom:96px}}
@media (prefers-reduced-motion:no-preference){

  .meter>i{transition:width .5s ease}
  .btn,.chip-btn,.nav button{transition:background .15s}
}

function cloudLoadOrMigrate(){
  if(!cloud.client||!cloud.user)return Promise.resolve();
  cloud.busy=true;cloud.ready=false;cloudMessage('Checking cloud data…');
  return cloud.client.from('pennywise_data').select('data,updated_at').eq('user_id',cloud.user.id).maybeSingle().then(function(res){
    if(res.error)throw res.error;
    var remote=res.data&&res.data.data;
    if(remote&&validBackup(remote)){
      var useCloud=window.confirm('Cloud data was found for this account. Choose OK to load cloud data on this device (this replaces the current local data). Choose Cancel to keep local data and stop syncing for now. Export a local backup before continuing.');
      if(!useCloud){cloud.status='Sync paused: local data kept';cloud.ready=false;return;}
      S=remote;
      try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}
      cloud.ready=true;cloud.status='Connected · cloud data loaded';render();cloudMessage(cloud.status);return;
    }
    if(res.data&&!validBackup(remote))throw new Error('Cloud row exists but its data format is not a valid Pennywise backup. No data changed.');
    var upload=window.confirm('No cloud data exists for this account. Upload the data currently on this device to your cloud account? Choose Cancel to leave cloud data empty and keep sync off. Export a backup first.');
    if(!upload){cloud.status='Sync paused: local data kept';cloud.ready=false;return;}
    return cloud.client.from('pennywise_data').upsert({user_id:cloud.user.id,data:S,updated_at:new Date().toISOString()},{onConflict:'user_id'}).then(function(r){
      if(r.error)throw r.error;cloud.ready=true;cloud.status='Connected · local data uploaded';cloudMessage(cloud.status);
    });
  }).catch(function(err){cloud.ready=false;cloud.status='Sync error: '+(err&&err.message?err.message:'request failed');cloudMessage(cloud.status);})
  .finally(function(){cloud.busy=false;});
}
function cloudSave(){
  if(!cloud.client||!cloud.user||!cloud.ready||cloud.suppress)return;
  clearTimeout(cloud.timer);
  cloud.timer=setTimeout(function(){
    var snapshot=JSON.parse(JSON.stringify(S)),uid=cloud.user.id;
    cloud.client.from('pennywise_data').upsert({user_id:uid,data:snapshot,updated_at:new Date().toISOString()},{onConflict:'user_id'})
    .then(function(r){if(r.error)throw r.error;if(cloud.user&&cloud.user.id===uid){cloud.status='Connected · synced';paintCloudPanel();}})
    .catch(function(err){cloud.status='Sync error: '+(err&&err.message?err.message:'request failed');paintCloudPanel();});
  },700);
}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S));storageOK=true;lastSavedAt=new Date();cloudSave();return true;}catch(e){var wasOK=storageOK;storageOK=false;if(wasOK&&typeof toast==='function')toast('Warning: browser storage failed. Download a backup and keep this tab open.');return false;}}
function validBackup(o){
  if(o&&o.app==='Pennywise'&&o.data)o=o.data;
  if(!o||o.v!==1||!Array.isArray(o.tx)||!Array.isArray(o.goals)||!o.budget||typeof o.budget!=='object')return false;
  var ok=true;
  o.tx.forEach(function(t){if(!t||typeof t.id!=='string'||typeof t.date!=='string'||!/^\d{4}-\d{2}-\d{2}$/.test(t.date)||typeof t.desc!=='string'||!isFinite(Number(t.amt))||Number(t.amt)<0||['income','expense','saving'].indexOf(t.type)<0)ok=false;});
  o.goals.forEach(function(g){if(!g||typeof g.id!=='string'||typeof g.name!=='string'||!isFinite(Number(g.target))||Number(g.target)<=0)ok=false;});
  return ok;
}
function exportBackup(){
  var payload={app:'Pennywise',formatVersion:1,exportedAt:new Date().toISOString(),note:'Keep this file private. It may contain personal financial information.',data:S};
  var blob=new Blob([JSON.stringify(payload,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');
  a.href=url;a.download='Pennywise-backup-'+ymd(new Date())+'.json';document.body.appendChild(a);a.click();a.remove();setTimeout(function(){URL.revokeObjectURL(url);},1000);
  toast('Backup prepared. Check your Downloads folder and keep a second copy somewhere safe.');
}
function restoreBackup(file){
  if(!file)return;
  var rd=new FileReader();rd.onload=function(){
    var o;try{o=JSON.parse(String(rd.result||''));}catch(e){toast('That file is not valid JSON. Nothing was changed.');return;}
    var data=o&&o.app==='Pennywise'?o.data:o;
    if(!validBackup(data)){toast('This does not look like a valid Pennywise backup. Nothing was changed.');return;}
    if(!window.confirm('Restore this backup? Your current Pennywise data will be replaced. Export a backup of the current data first if you want to keep it.'))return;
    S=data;
    if(!save()){toast('Restore loaded in this session, but browser storage failed. Export a backup immediately and keep this tab open.');}
    else toast('Backup restored successfully.');
    V.confirm='';render();
  };
  rd.onerror=function(){toast('Could not read that file. Nothing was changed.');};rd.readAsText(file);
}

/* ---------- calculations ---------- */
function txOf(m){return S.tx.filter(function(t){return t.date.slice(0,7)===m;});}
function totals(m){var r={inc:0,exp:0,sav:0};txOf(m).forEach(function(t){if(t.type==='income')r.inc+=t.amt;else if(t.type==='expense')r.exp+=t.amt;else r.sav+=t.amt;});return r;}
function byCat(m){var o={};txOf(m).forEach(function(t){if(t.type==='expense')o[t.cat]=(o[t.cat]||0)+t.amt;});return o;}
function balance(){return S.tx.reduce(function(b,t){return b+(t.type==='income'?t.amt:-t.amt);},0);}
function goalSaved(g){return S.tx.reduce(function(a,t){return a+(t.goalId===g.id?t.amt:0);},0);}
function streak(){
  var days={};S.tx.forEach(function(t){if(!t.auto)days[t.date]=1;});
  var d=parseD(TODAY),n=0;
  if(!days[ymd(d)])d.setDate(d.getDate()-1);
  while(days[ymd(d)]){n++;d.setDate(d.getDate()-1);}
  return n;
}
function level(p){return p>=100?'bad':p>=S.budget.alertAt?'warn':'good';}
var LHUE={good:'mint',warn:'butter',bad:'rose'};
var LTXT={good:'On track',warn:'Close to limit',bad:'Over limit'};
function alerts(){
  var out=[],b=S.budget,sp=byCat(CURM),tot=totals(CURM).exp;
  if(b.total>0){var p=tot/b.total*100;
    if(p>=100)out.push({l:'bad',t:'You have spent '+inr(tot)+', which is over your '+inr(b.total)+' monthly budget.'});
    else if(p>=b.alertAt)out.push({l:'warn',t:'You have used '+Math.round(p)+'% of your monthly budget.'});}
  EXP.forEach(function(c){var lim=b.limits[c];if(!lim)return;var p=(sp[c]||0)/lim*100;
    if(p>=100)out.push({l:'bad',t:c+' is over its '+inr(lim)+' limit ('+inr(sp[c])+' spent).'});
    else if(p>=b.alertAt)out.push({l:'warn',t:c+' is at '+Math.round(p)+'% of its '+inr(lim)+' limit.'});});
  out.sort(function(a,b){return (a.l==='bad'?0:1)-(b.l==='bad'?0:1);});
  return out;
}
function processAllow(){
  var n=0,total=0;
  S.allow.forEach(function(a){
    if(!a.on)return;var g=0;
    while(a.next<=TODAY&&g++<60){S.tx.push({id:nid(),date:a.next,desc:a.name,cat:a.cat,amt:a.amt,type:'income',auto:true});n++;total+=a.amt;a.next=advance(a);}
  });
  return {n:n,total:total};
}

var MON3=['jan','feb','mar','apr','may','jun','jul','aug','sep','oct','nov','dec'];
var KW=[['Food',/swiggy|zomato|canteen|cafe|coffee|chai|restaurant|dominos|pizza|burger|kfc|mcdonald|bakery|snack|blinkit|zepto|bigbasket|grocer/i],
 ['Transport',/uber|ola\b|rapido|metro|irctc|redbus|petrol|fuel|bus\b|auto\b|train|fastag/i],
 ['Shopping',/amazon|flipkart|myntra|ajio|meesho|nykaa|store|mart\b|mall/i],
 ['Fun',/netflix|spotify|hotstar|prime video|bookmyshow|movie|game|steam|youtube|pvr/i],
 ['Study',/book|course|udemy|coursera|tuition|stationery|exam|college|school|fee\b|xerox|print/i],
 ['Bills',/recharge|airtel|jio|vodafone|electric|bill|wifi|broadband|dth|rent/i],
 ['Health',/pharm|medic|apollo|clinic|hospital|gym|doctor|1mg|netmeds/i]];
function guessCat(desc,type){
  if(type==='income'){if(/salary/i.test(desc))return 'Salary';if(/pocket|allowance|dad|mom|mother|father|parent/i.test(desc))return 'Allowance';if(/freelance|client|project/i.test(desc))return 'Freelance';return 'Other income';}
  for(var i=0;i<KW.length;i++)if(KW[i][1].test(desc))return KW[i][0];
  return 'Other';
}
function anyDate(s){
  s=s.trim();var m,r=null;
  if((m=s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/)))r=m[1]+'-'+pad(+m[2])+'-'+pad(+m[3]);
  else if((m=s.match(/^(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{2,4})/))){var y=+m[3];if(y<100)y+=2000;r=y+'-'+pad(+m[2])+'-'+pad(+m[1]);}
  else if((m=s.match(/^(\d{1,2})\s+([A-Za-z]{3})[a-z]*,?\s+(\d{4})/))){var i=MON3.indexOf(m[2].toLowerCase());if(i>=0)r=m[3]+'-'+pad(i+1)+'-'+pad(+m[1]);}
  if(!r)return null;
  return ymd(parseD(r))===r?r:null;
}
function splitCsv(line){
  var out=[],cur='',q=false,i,c;
  for(i=0;i<line.length;i++){c=line[i];
    if(q){if(c==='"'){if(line[i+1]==='"'){cur+='"';i++;}else q=false;}else cur+=c;}
    else if(c==='"')q=true;
    else if(c===','||c==='\t'){out.push(cur.trim());cur='';}
    else cur+=c;}
  out.push(cur.trim());return out;
}
function numOf(s){var v=parseFloat(String(s).replace(/[₹,\s]|INR|Rs\.?/gi,''));return isNaN(v)?null:v;}
function parseStatement(text){
  var rows=[],seen={};
  S.tx.forEach(function(t){seen[t.date+'|'+t.type+'|'+t.amt]=1;});
  text.split(/\r?\n/).forEach(function(line){
    line=line.trim();if(!line)return;
    var parts=splitCsv(line);if(parts.length<3)return;
    var date=anyDate(parts[0]);if(!date)return;
    var desc=parts[1].replace(/^UPI[\/\- ]+/i,'').trim().slice(0,60)||'UPI payment';
    var rest=parts.slice(2),flagRe=/^(dr|cr|debit|credit)\.?$/i;
    var flag=null,nums=[];
    rest.forEach(function(x){if(flagRe.test(x.trim()))flag=x.trim();else nums.push({raw:x,v:numOf(x)});});
    var amt=null,type=null;
    if(flag){var f=nums.filter(function(x){return x.v!=null;})[0];amt=f?f.v:null;type=/^(cr|credit)/i.test(flag)?'income':'expense';}
    else if(nums.length>=2){var d=nums[0].v||0,c=nums[1].v||0;if(c>0&&!d){type='income';amt=c;}else if(d>0){type='expense';amt=d;}}
    else if(nums.length===1&&nums[0].v!=null){amt=nums[0].v;type=(amt<0||/dr\s*$/i.test(nums[0].raw))?'expense':'income';}
    if(amt==null||amt===0||!type)return;
    amt=Math.abs(amt);
    var dup=!!seen[date+'|'+type+'|'+amt];
    rows.push({on:!dup,date:date,desc:desc,type:type,cat:guessCat(desc,type),amt:amt,dup:dup});
  });
  return rows;
}

  var d=function(n){var x=parseD(TODAY);x.setDate(x.getDate()-n);return ymd(x);};
  return ['Date,Description,Amount',d(1)+',UPI/Chai and snacks,-80',d(1)+',UPI/Swiggy Instamart,-312',d(2)+',UPI/Rapido Ride,-74',d(3)+',UPI/Udemy Course,-449',

}

    '<td><select data-imp="type" data-i="'+i+'" aria-label="Type for '+esc(x.desc)+'"><option value="expense"'+(x.type==='expense'?' selected':'')+'>Spent</option><option value="income"'+(x.type==='income'?' selected':'')+'>Earned</option></select></td>'+
    '<td><select data-imp="cat" data-i="'+i+'" aria-label="Category for '+esc(x.desc)+'">'+(x.type==='income'?INC:EXP).map(function(c){return '<option'+(c===x.cat?' selected':'')+'>'+c+'</option>';}).join('')+'</select></td><td class="num">'+inr(x.amt)+'</td></tr>';}).join('')+'</tbody></table></div>'+
   '<div><button class="btn" type="button" data-act="import-upi">Import '+pl(n,'entry').replace('entrys','entries')+'</button></div>';
}

/* ---------- dialogs ---------- */
function dlgHead(id,title){return '<div class="dlg-h"><h2 id="'+id+'">'+title+'</h2><button type="button" class="icon-btn" data-act="close-dlg" aria-label="Close">'+ic('x')+'</button></div>';}
function catOpts(type,sel){return (type==='income'?INC:EXP).map(function(c){return '<option'+(c===sel?' selected':'')+'>'+c+'</option>';}).join('');}
function openDlg(html,labelId){var d=$('#dlg');d.setAttribute('aria-labelledby',labelId);d.innerHTML=html;if(!d.open){try{d.showModal();}catch(e){d.setAttribute('open','');}}}
function dlgTx(){
  openDlg('<form class="dlg form" data-form="tx">'+dlgHead('d1','Add an entry')+
   '<div class="seg" role="radiogroup" aria-label="Entry type"><label><input type="radio" name="type" value="expense" checked><span>Spent</span></label><label><input type="radio" name="type" value="income"><span>Earned</span></label></div>'+
   '<label class="f">Amount (₹)<input id="tx-amt" name="amt" type="number" inputmode="decimal" min="1" step="1" required placeholder="250"></label>'+
   '<label class="f">What was it for?<input id="tx-desc" name="desc" type="text" maxlength="60" required placeholder="Canteen lunch"></label>'+
   '<div class="grid g2"><label class="f">Category<select id="tx-cat" name="cat">'+catOpts('expense','Food')+'</select></label><label class="f">Date<input id="tx-date" name="date" type="date" max="'+TODAY+'" value="'+TODAY+'" required></label></div>'+
   '<button class="btn" type="submit">Save entry</button></form>','d1');
}
function dlgGoal(){
  openDlg('<form class="dlg form" data-form="goal">'+dlgHead('d2','New savings goal')+
   '<label class="f">Goal name<input id="g-name" name="name" type="text" maxlength="40" required placeholder="New laptop"></label>'+
   '<div class="grid g2"><label class="f">Target (₹)<input id="g-target" name="target" type="number" inputmode="numeric" min="1" step="1" required placeholder="30000"></label><label class="f">Target date (optional)<input id="g-date" name="date" type="date" min="'+TODAY+'"></label></div>'+
   '<fieldset style="border:0;padding:0;margin:0"><legend style="font-weight:600;font-size:14px;margin-bottom:8px">Colour</legend><div class="swatches">'+HUES.map(function(h,i){return '<label class="h-'+h+'"><input type="radio" name="hue" value="'+h+'"'+(i===S.goals.length%6?' checked':'')+' aria-label="'+h+'"><span></span></label>';}).join('')+'</div></fieldset>'+
   '<button class="btn" type="submit">Create goal</button></form>','d2');
}
function dlgAllow(){
  openDlg('<form class="dlg form" data-form="allow">'+dlgHead('d3','Add a recurring payment')+
   '<label class="f">Name<input id="a-name" name="name" type="text" maxlength="40" required placeholder="Monthly pocket money"></label>'+
   '<div class="grid g2"><label class="f">Amount (₹)<input id="a-amt" name="amt" type="number" inputmode="numeric" min="1" step="1" required placeholder="2000"></label>'+
   '<label class="f">Repeats<select id="a-freq" name="freq"><option value="monthly">Every month</option><option value="weekly">Every week</option></select></label></div>'+
   '<div class="grid g2"><label class="f">Next payment date<input id="a-next" name="next" type="date" min="'+TODAY+'" value="'+TODAY+'" required></label>'+
   '<label class="f">Type<select id="a-cat" name="cat">'+['Allowance','Salary','Freelance','Gift'].map(function(c){return '<option>'+c+'</option>';}).join('')+'</select></label></div>'+
   '<button class="btn" type="submit">Save recurring payment</button></form>','d3');
}
function dlgUpi(){
  V.imp=[];
  openDlg('<div class="dlg">'+dlgHead('d4','Import a UPI statement')+
   '<div class="alert h-mint">'+ic('check',20)+'<span>Pennywise never asks for your UPI PIN, OTP or bank login. Export a statement from your UPI app or bank and paste it here. It is read in your browser and is not uploaded.</span></div>'+
   '<p class="muted" style="font-size:14px">One transaction per line: <code>date, description, amount</code>. Negative amounts are money out. You can also use separate debit and credit columns, or a Dr or Cr column. Dates like 2026-10-12 or 12/10/2026 work.</p>'+
   '<label class="f">Statement text<textarea id="imp-text" placeholder="2026-10-12, UPI/Swiggy, -245"></textarea></label>'+
   '<div class="acts"><label class="btn soft sm" for="imp-file" style="cursor:pointer">'+ic('upload',16)+'Choose CSV file</label><input id="imp-file" class="sr" type="file" accept=".csv,.txt,text/csv,text/plain"><button class="btn soft sm" type="button" data-act="sample-upi">Use sample</button><button class="btn sm" type="button" data-act="preview-upi">Preview</button></div>'+
   '<p id="imp-msg" class="muted" role="status"></p><div id="imp-prev" class="stack">'+'</div></div>','d4');
}

/* ---------- render ---------- */
var VIEWS={home:viewHome,money:viewMoney,budget:viewBudget,goals:viewGoals,reports:viewReports,learn:viewLearn};
function navHtml(bar){return TABS.map(function(t){return '<button data-act="tab" data-tab="'+t[0]+'"'+(V.tab===t[0]?' aria-current="page"':'')+'>'+ic(t[2],bar?22:20)+'<span>'+t[1]+'</span></button>';}).join('');}
function isDark(){var r=document.documentElement,a=r.getAttribute('data-theme');return a==='dark'||(!a&&window.matchMedia&&window.matchMedia('(prefers-color-scheme: dark)').matches);}
function syncTheme(){document.querySelectorAll('.switch').forEach(function(b){b.setAttribute('aria-checked',String(isDark()));});}
function render(focusId){
  $('#view').innerHTML=cloudPanel()+VIEWS[V.tab]();
  $('#nav-side').innerHTML=navHtml(false);$('#nav-bar').innerHTML=navHtml(true);
  $('#fab').innerHTML=ic('plus',20)+'Add entry';
  syncTheme();
  if(focusId){var el=document.getElementById(focusId);if(el)el.focus();}
}
var tt;
function toast(msg){var el=$('#toast');el.textContent=msg;el.classList.add('on');clearTimeout(tt);tt=setTimeout(function(){el.classList.remove('on');},4800);}
function closeDlg(){var d=$('#dlg');try{d.close();}catch(e){d.removeAttribute('open');}}
function pcts(cat){var b=S.budget,sp=byCat(CURM),t=totals(CURM).exp;return {tot:b.total?t/b.total*100:0,cat:(cat&&b.limits[cat])?(sp[cat]||0)/b.limits[cat]*100:0};}
function updLimit(c){
  var lim=S.budget.limits[c]||0,sp=byCat(CURM)[c]||0,p=lim?sp/lim*100:0,lv=lim?level(p):'good';
  var pill=$('#lp-'+c);pill.className='pill h-'+LHUE[lv];pill.textContent=lim?LTXT[lv]:'No limit';
  $('#lb-'+c).innerHTML=meter(p,HUE[c]);$('#lsum').textContent=sumNote();
}
function setTab(t){V.tab=t;V.confirm='';try{history.replaceState(null,'','#'+t);}catch(e){}render();window.scrollTo(0,0);$('#view').focus({preventScroll:true});}

/* ---------- actions ---------- */
var ACT={
  tab:function(el){setTab(el.dataset.tab);},
  goto:function(el){setTab(el.dataset.tab);},
  theme:function(){var d=!isDark();document.documentElement.setAttribute('data-theme',d?'dark':'light');S.theme=d?'dark':'light';save();syncTheme();},
  'add-tx':dlgTx,'add-goal':dlgGoal,'add-allow':dlgAllow,upi:dlgUpi,
  'close-dlg':closeDlg,
  ftype:function(el){V.f.type=el.dataset.v;document.querySelectorAll('[data-act="ftype"]').forEach(function(b){b.setAttribute('aria-pressed',String(b===el));});$('#txlist').innerHTML=listHtml();},
  'del-tx':function(el){S.tx=S.tx.filter(function(t){return t.id!==el.dataset.id;});save();render();toast('Entry deleted.');},
  'del-allow':function(el){S.allow=S.allow.filter(function(a){return a.id!==el.dataset.id;});save();render();},
  'toggle-allow':function(el){S.allow.forEach(function(a){if(a.id===el.dataset.id){a.on=!a.on;if(a.on&&a.next<TODAY)a.next=TODAY;}});save();render();},
  'del-goal':function(el){
    var id=el.dataset.id;
    if(V.confirm!==id){V.confirm=id;render();return;}
    S.goals=S.goals.filter(function(g){return g.id!==id;});S.tx=S.tx.filter(function(t){return t.goalId!==id;});V.confirm='';save();render();toast('Goal deleted and savings returned to your balance.');
  },
  backup:function(){exportBackup();},
  reset:function(){if(V.confirm!=='reset'){V.confirm='reset';render();return;}try{localStorage.removeItem(KEY);}catch(e){}S=seed();V.confirm='';save();render();toast('App data cleared. You can start fresh.');},
  claim:function(el){var id=el.dataset.id;S.done[id]=true;save();render();toast('Challenge complete.');},
  'copy-csv':function(){
    var ta=$('#csv-out');
    var fb=function(){ta.focus();ta.select();toast('Selected. Press Ctrl+C or Cmd+C to copy.');};
    try{navigator.clipboard.writeText(ta.value).then(function(){toast('CSV copied.');},fb);}catch(e){fb();}
  },
  'sample-upi':function(){$('#imp-text').value=sampleStmt();ACT['preview-upi']();},
  'preview-upi':function(){
    V.imp=parseStatement($('#imp-text').value);
    $('#imp-prev').innerHTML=previewHtml();
    $('#imp-msg').textContent=V.imp.length?'Check the categories, then import.':'No transactions found. Each line needs a date, a description and an amount.';
  },
  'import-upi':function(){
    var n=0;
    V.imp.forEach(function(x){if(x.on){S.tx.push({id:nid(),date:x.date,desc:x.desc,cat:x.cat,amt:x.amt,type:x.type,src:'upi'});n++;}});
    if(!n){toast('Select at least one entry to import.');return;}
    save();closeDlg();V.f.m='all';V.f.type='all';V.f.cat='all';V.f.q='';setTab('money');toast('Imported '+pl(n,'entry').replace('entrys','entries')+'.');
  }
};
document.addEventListener('click',function(e){
  var ca=e.target.closest('[data-cloud-act]');
  if(ca){
    if(ca.dataset.cloudAct==='sync'){if(cloud.user){cloud.ready=false;cloudLoadOrMigrate();}else toast('Sign in first.');}
    if(ca.dataset.cloudAct==='signout'&&cloud.client){
      cloud.client.auth.signOut().then(function(r){if(r.error)throw r.error;cloud.user=null;cloud.ready=false;cloud.status='Signed out';render();})
      .catch(function(err){toast('Sign out failed: '+err.message);});
    }
    return;
  }
  if(e.target&&e.target.id==='dlg'){closeDlg();return;}
  var el=e.target.closest('[data-act]');if(!el)return;
  var fn=ACT[el.dataset.act];if(fn)fn(el,e);
});

/* ---------- forms ---------- */
var FORMS={
  tx:function(fd){
    var type=fd.get('type'),amt=Number(fd.get('amt')),desc=String(fd.get('desc')||'').trim(),cat=fd.get('cat'),date=String(fd.get('date')||'');
    if(!(amt>0)||!desc||!date||date>TODAY||ymd(parseD(date))!==date){toast('Enter an amount, a description and a valid date.');return;}
    var inMonth=type==='expense'&&date.slice(0,7)===CURM,before=inMonth?pcts(cat):null;
    S.tx.push({id:nid(),date:date,desc:desc,cat:cat,amt:amt,type:type});save();
    var msg='Entry saved.';
    if(inMonth){var a=pcts(cat),at=S.budget.alertAt,lim=S.budget.limits[cat];
      if(lim&&before.cat<100&&a.cat>=100)msg=cat+' is now over its '+inr(lim)+' limit.';
      else if(lim&&before.cat<at&&a.cat>=at)msg=cat+' is at '+Math.round(a.cat)+'% of its limit.';
      else if(S.budget.total&&before.tot<100&&a.tot>=100)msg='You are over your monthly budget.';
      else if(S.budget.total&&before.tot<at&&a.tot>=at)msg='You have used '+Math.round(a.tot)+'% of your monthly budget.';}
    closeDlg();render();toast(msg);
  },
  goal:function(fd){
    var name=String(fd.get('name')||'').trim(),target=Number(fd.get('target'));
    if(!name||!(target>0)){toast('Give the goal a name and a target amount.');return;}
    S.goals.push({id:nid(),name:name,target:target,date:String(fd.get('date')||''),hue:fd.get('hue')||'lilac'});save();closeDlg();setTab('goals');toast('Goal created.');
  },
  allow:function(fd){
    var name=String(fd.get('name')||'').trim(),amt=Number(fd.get('amt')),next=String(fd.get('next')||'');
    if(!name||!(amt>0)||!next){toast('Fill in the name, amount and first date.');return;}
    S.allow.push({id:nid(),name:name,amt:amt,freq:fd.get('freq'),next:next,anchor:Number(next.slice(8)),cat:fd.get('cat'),on:true});
    var r=processAllow();save();closeDlg();render();
    toast(r.n?'Credited '+inr(r.total)+' right away.':'Recurring payment saved.');
  },
  addsave:function(fd,f){
    var g=S.goals.filter(function(x){return x.id===f.dataset.id;})[0],amt=Number(fd.get('amt'));
    if(!g||!(amt>0))return;
    if(amt>balance()){toast('That is more than your available balance of '+inr(balance())+'.');return;}
    S.tx.push({id:nid(),date:TODAY,desc:'Added to '+g.name,cat:'Savings',amt:amt,type:'saving',goalId:g.id});save();render();
    toast(inr(amt)+' added to '+g.name+'.');
  },
  budget:function(fd){
    var total=Number(fd.get('total'));if(!(total>=0))return;
    S.budget.total=total;S.budget.alertAt=Number(fd.get('alertAt'))||80;save();render();toast('Budget saved.');
  },
  quiz:function(fd,f){
    var id=f.dataset.id,q=QUIZ.filter(function(x){return x.id===id;})[0],a=fd.get('a');
    if(!q||a===null)return;
    if(Number(a)===q.a){S.done[id]=true;V.fb[id]=null;save();render();toast('Correct. +'+q.xp+' XP');}
    else{V.fb[id]={ok:false};render();}
  }
};
document.addEventListener('submit',function(e){
  var cf=e.target.closest('form[data-cloud-form="auth"]');
  if(cf){
    e.preventDefault();
    if(!cloud.client){toast('Cloud service is unavailable. Check your internet connection.');return;}
    var fd=new FormData(cf),email=String(fd.get('email')||'').trim(),password=String(fd.get('password')||''),submitter=e.submitter,mode=submitter&&submitter.value==='signup'?'signup':'signin';
    cloud.status=mode==='signup'?'Creating account…':'Signing in…';paintCloudPanel();
    var req=mode==='signup'?cloud.client.auth.signUp({email:email,password:password}):cloud.client.auth.signInWithPassword({email:email,password:password});
    req.then(function(r){
      if(r.error)throw r.error;
      if(mode==='signup'&&!r.data.session){cloud.status='Check your email for the confirmation link, then sign in.';paintCloudPanel();toast(cloud.status);return;}
      cloud.user=r.data.user||null;
      if(!cloud.user)throw new Error('Authentication returned no user.');
      return cloudLoadOrMigrate().then(function(){render();});
    }).catch(function(err){cloud.status='Sign-in error: '+(err&&err.message?err.message:'request failed');paintCloudPanel();});
    return;
  }
  var f=e.target.closest('form[data-form]');if(!f)return;
  e.preventDefault();FORMS[f.dataset.form](new FormData(f),f);
});

/* ---------- inputs ---------- */
document.addEventListener('input',function(e){
  var t=e.target;
  if(t.dataset&&t.dataset.filter==='q'){V.f.q=t.value;$('#txlist').innerHTML=listHtml();}
});
document.addEventListener('change',function(e){
  var t=e.target,ds=t.dataset||{};
  if(ds.filter==='m'||ds.filter==='cat'){V.f[ds.filter]=t.value;$('#txlist').innerHTML=listHtml();}
  else if(ds.rm!==undefined){V.rm=t.value;render('r-m');}
  else if(ds.limit){var v=Number(t.value);if(v>0)S.budget.limits[ds.limit]=v;else delete S.budget.limits[ds.limit];save();updLimit(ds.limit);}
  else if(t.name==='type'&&t.closest('form[data-form="tx"]')){$('#tx-cat').innerHTML=catOpts(t.value,t.value==='income'?'Allowance':'Food');}
  else if(ds.imp){
    var i=Number(ds.i),r=V.imp[i];if(!r)return;
    if(ds.imp==='on'){r.on=t.checked;var b=$('[data-act="import-upi"]');if(b)b.textContent='Import '+pl(V.imp.filter(function(x){return x.on;}).length,'entry').replace('entrys','entries');}
    else if(ds.imp==='cat'){r.cat=t.value;}
    else if(ds.imp==='type'){r.type=t.value;r.cat=guessCat(r.desc,r.type);$('#imp-prev').innerHTML=previewHtml();}
  }
  else if(t.id==='restore-file'&&t.files&&t.files[0]){restoreBackup(t.files[0]);t.value='';}
  else if(t.id==='imp-file'&&t.files&&t.files[0]){
    var rd=new FileReader();rd.onload=function(){$('#imp-text').value=String(rd.result||'');ACT['preview-upi']();};rd.readAsText(t.files[0]);
  }
});

/* ---------- start ---------- */
if(cloud.client){
  cloud.client.auth.getSession().then(function(r){
    if(r.error)throw r.error;
    if(r.data.session){cloud.user=r.data.session.user;cloudLoadOrMigrate().then(function(){render();});}
  }).catch(function(err){cloud.status='Session check failed: '+err.message;paintCloudPanel();});
}
var credited=processAllow();
if(S.theme)document.documentElement.setAttribute('data-theme',S.theme);
save();render();
if(!storageOK)toast('Warning: browser storage is unavailable. Download a backup and keep this tab open.');
if(credited.n)toast('Credited '+inr(credited.total)+' from your recurring allowance.');
})();
</script>

</body></html>
